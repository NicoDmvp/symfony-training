Dinosaur:
    type: object
    config:
        fields:
            id: { type: 'ID!' }
            name: { type: 'String!', deprecationReason: "Use displayName instead" }
            displayName:
                type: 'String!'
                complexity: '@=5'
            gender: { type: 'String!' }
            age: { type: 'Int!' }
            eyesColor: { type: 'String!' }
            species: { type: 'Species!' }
            birthdate: { type: 'String'}
